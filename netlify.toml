{
  "build": {
    "command": "npm run build",
    "functions": {
      "api/**/*.ts": {
        "memory": 1024,
        "timeout": 10
      }
    },
    "publish": ".next"
  },
  "redirects": [],
  "headers": [
    {
      "path": "**",
      "headers": [
        {
          "key": "Cache-Control",
          "value": "public, max-age=3600"
        },
        {
          "key": "X-Content-Type-Options",
          "value": "nosniff"
        }
      ]
    }
  ]
}
